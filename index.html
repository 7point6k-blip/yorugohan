<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜ご飯</title>
<meta name="theme-color" content="#eef0ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="夜ご飯">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one narrow phone column — date, today's summary card, the two pickers, then the week list; other days open in a bottom sheet */
:root {
  --bg: #eef0ec;
  --card: #ffffff;
  --ink: #22262b;
  --muted: #6f7680;
  --line: #dde1dc;
  --accent: #2f4b8f;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8f5;
  --shade: rgba(20, 24, 30, .38);
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --card: #1f2228; --ink: #eceef1; --muted: #9aa1ab; --line: #31353d;
    --accent: #8fa8e8; --accent-ink: #10162a; --accent-soft: #263150; --shade: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --card: #1f2228; --ink: #eceef1; --muted: #9aa1ab; --line: #31353d;
  --accent: #8fa8e8; --accent-ink: #10162a; --accent-soft: #263150; --shade: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.top { padding: 4px 2px 0; font-family: var(--font-display); font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }

.card { background: var(--card); border-radius: 22px; padding: 18px; border: 1px solid var(--line); }
.label { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin: 0 0 10px; font-weight: 700; }

/* 今日カード */
.today { display: grid; grid-template-columns: 1fr 1fr; padding: 0; overflow: hidden; }
.today .half { padding: 18px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.today .half + .half { border-left: 1px solid var(--line); }
.today .k { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.big { font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big.mid { font-size: 24px; }
.big.none { color: var(--muted); font-size: 22px; }
.big .sfx, .big i { font-style: normal; font-size: 15px; color: var(--muted); margin-left: 2px; }
.big.sub { font-size: 18px; color: var(--muted); }
.today .s { font-size: 13px; color: var(--muted); }

/* 夜ご飯の選択 */
.dinner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.opt { grid-column: span 2; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 62px; }
.opt.wide { grid-column: span 3; }
.opt b { font-family: var(--font-display); font-weight: 900; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt b .sfx { font-size: 13px; margin-left: 1px; }
.opt small { font-size: 12px; color: var(--muted); }
.opt.tbd b { font-size: 16px; color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.on.tbd b { color: var(--ink); }
.opt:active { transform: scale(.97); }

/* 起床の選択 */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 0; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.timer { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 10px; margin-top: 14px; }
.step { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.tfield { position: relative; display: inline-flex; align-items: baseline; border: 2px solid var(--line); border-radius: 14px; padding: 2px 16px; background: var(--bg); }
.tfield .w { font-family: var(--font-display); font-weight: 900; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tfield i { font-style: normal; font-size: 16px; color: var(--muted); margin-left: 2px; font-family: var(--font-display); font-weight: 700; }
.tfield input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; }
.tbox .b { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.wheelwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
.wheels { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px; height: 200px; width: 100%; max-width: 260px; }
.wheels::before { content: ""; position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-radius: 10px; background: var(--bg); z-index: 0; }
.wheel { position: relative; z-index: 1; height: 200px; width: 72px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel div { height: 40px; line-height: 40px; text-align: center; scroll-snap-align: center; font-family: var(--font-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--muted); }
.wheel div.sel { color: var(--ink); font-weight: 900; }
.wheel .padrow { scroll-snap-align: none; }
.colon { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 900; font-size: 24px; }
.wlabel { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 16px; width: 20px; }
.wheelwrap .b { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-display); font-size: 18px; }
.sendbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: linear-gradient(transparent, var(--bg) 30%);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sendbar button { display: block; width: 100%; max-width: 440px; margin: 0 auto; border: 0; border-radius: 18px; padding: 16px; font-family: var(--font-display); font-weight: 900; font-size: 18px; background: var(--accent); color: var(--accent-ink); }
.sendbar button:disabled { background: var(--line); color: var(--muted); }
body.has-send { padding-bottom: 110px; }
.hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
.hours button { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 7px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.hours button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* 週 */
.week { padding: 6px 0; }
.week .label { padding: 12px 18px 4px; margin: 0; }
.row { width: 100%; display: grid; grid-template-columns: 74px 1fr 1fr 12px; align-items: center; gap: 8px; padding: 12px 18px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.row:first-of-type { border-top: 0; }
.row .d { font-size: 13px; font-variant-numeric: tabular-nums; }
.row .c { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; min-width: 0; line-height: 1.3; }
.row .c.m { color: var(--muted); font-weight: 500; }
.row .c small { font-size: 11px; color: var(--muted); font-family: var(--font-body); font-weight: 400; margin-left: 3px; }
.row .chev { color: var(--muted); }
.row.static { cursor: default; grid-template-columns: 74px 1fr 1fr; }

.foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 8px 14px; font-size: 13px; color: var(--muted); }

/* 最初の選択 */
.pick { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
.pick p { color: var(--muted); margin: 0 0 8px; }
.pick button { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 18px; font-size: 18px; font-weight: 700; font-family: var(--font-display); }

/* シート */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-height: 90vh; overflow-y: auto;
}
.sheet-in { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 900; font-size: 20px; margin: 0; font-variant-numeric: tabular-nums; }
.done { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 8px 18px; font-weight: 700; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } .opt:active { transform: none; } }

.notice { font-size: 14px; line-height: 1.6; }

.notice { display: flex; flex-direction: column; gap: 10px; }
.notice button { border: 0; border-radius: 14px; padding: 14px; font-family: var(--font-display); font-weight: 900; font-size: 17px; background: var(--accent); color: var(--accent-ink); }
.center { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); line-height: 1.7; }
</style>
<script src="config.js"></script>
</head>
<body>
<main id="app"><p class="center">読み込み中…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>

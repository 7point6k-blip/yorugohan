<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜ご飯</title>
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="夜ご飯">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preload" as="image" href="img/plush.webp">
<style>
/* Layout: one narrow phone column — date, today's card (with the family plush sitting on it), pickers, then the week list; other days and the weekly base plan open in bottom sheets */
:root {
  --bg: #eef0ec;
  --card: #ffffff;
  --ink: #22262b;
  --muted: #6f7680;
  --line: #dde1dc;
  --accent: #2f4b8f;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8f5;
  --shade: rgba(20, 24, 30, .38);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --card: #1f2228; --ink: #eceef1; --muted: #9aa1ab; --line: #31353d;
    --accent: #8fa8e8; --accent-ink: #10162a; --accent-soft: #263150; --shade: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --card: #1f2228; --ink: #eceef1; --muted: #9aa1ab; --line: #31353d;
  --accent: #8fa8e8; --accent-ink: #10162a; --accent-soft: #263150; --shade: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 40px;
}
body.has-send { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }

.top { padding: 4px 2px 0; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; min-height: 64px; display: flex; align-items: flex-end; padding-bottom: 2px; }
.card { background: var(--card); border-radius: 22px; padding: 18px; border: 1px solid var(--line); }
.label { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin: 0 0 10px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.label .d { font-variant-numeric: tabular-nums; }

/* 今日カード＋ぬいぐるみ */
.today { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 0; margin-top: 34px; }
.today .half { padding: 18px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.today .half + .half { border-left: 1px solid var(--line); }
.today .k { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.today .k b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.plush { position: absolute; right: 44px; bottom: calc(100% - 7px); height: 78px; width: auto; pointer-events: none; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
.big { font-weight: 800; font-size: 32px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.big.mid { font-size: 24px; }
.big.none { color: var(--muted); font-size: 22px; font-weight: 700; }
.big .sfx, .big i { font-style: normal; font-size: 15px; color: var(--muted); margin-left: 2px; font-weight: 700; }
.big.sub { font-size: 19px; color: var(--muted); }
.today .s { font-size: 13px; color: var(--muted); }

/* 夜ご飯の選択 */
.dinner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.opt { grid-column: span 2; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 62px; }
.opt.wide { grid-column: span 3; }
.opt b { font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt b .sfx { font-size: 13px; margin-left: 1px; }
.opt small { font-size: 12px; color: var(--muted); }
.opt.tbd b { font-size: 16px; color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.on.tbd b { color: var(--ink); }
.opt:active { transform: scale(.97); }

/* 起床の選択 */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 0; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.wheelwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
.wheels { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px; height: 200px; width: 100%; max-width: 260px; }
.wheels::before { content: ""; position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-radius: 10px; background: var(--bg); z-index: 0; }
.wheel { position: relative; z-index: 1; height: 200px; width: 72px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel div { height: 40px; line-height: 40px; text-align: center; scroll-snap-align: center; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--muted); }
.wheel div.sel { color: var(--ink); font-weight: 800; }
.wheel .padrow { scroll-snap-align: none; }
.colon, .wlabel { position: relative; z-index: 1; font-weight: 800; }
.colon { font-size: 24px; }
.wlabel { color: var(--muted); font-size: 16px; width: 20px; font-weight: 700; }
.wheelwrap .b { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }

/* 週 */
.week { padding: 6px 0; }
.week .head { display: grid; grid-template-columns: 88px 1fr 1fr 12px; gap: 8px; padding: 12px 18px 6px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.row { width: 100%; display: grid; grid-template-columns: 88px 1fr 1fr 12px; align-items: center; gap: 8px; padding: 12px 18px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.row .d { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .c { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; min-width: 0; line-height: 1.3; }
.row .c.m { color: var(--muted); font-weight: 500; }
.row .c.base { font-weight: 500; }
.row .c small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.row .c .w2 { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.row .chev { color: var(--muted); }
.week.static .head, .row.static { grid-template-columns: 88px 1fr 1fr; }
.row.static { cursor: default; }
.tag { display: inline-block; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; margin-left: 4px; vertical-align: 2px; font-weight: 500; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 14px; padding: 12px; width: 100%; }

/* 送信 */
.sendbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: linear-gradient(transparent, var(--bg) 30%);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sendbar button { display: block; width: 100%; max-width: 440px; margin: 0 auto; border: 0; border-radius: 18px; padding: 16px; font-weight: 800; font-size: 18px; background: var(--accent); color: var(--accent-ink); }
.sendbar button:disabled { background: var(--line); color: var(--muted); }

.notice { display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.6; }
.notice button { border: 0; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 17px; background: var(--accent); color: var(--accent-ink); }
.center { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); line-height: 1.7; }

/* シート */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet-in { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-head h2 { font-weight: 800; font-size: 20px; margin: 0; font-variant-numeric: tabular-nums; }
.sheet-head .back { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 6px 0; }
.done { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 8px 18px; font-weight: 700; flex: none; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 10px 14px; font-size: 14px; color: var(--muted); }

/* 大学に行く日 */
.tabs { background: var(--line); }
.seg.two { grid-template-columns: 1fr 1fr; }
.tabs ~ .today { margin-top: 70px; }
.tabs button { font-size: 15px; padding: 10px 0; }
.pgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pgrid .opt { grid-column: auto; min-height: 56px; padding: 8px 2px; border-radius: 14px; }
.pgrid .opt b { font-size: 15px; }
.pgrid .opt small { font-size: 11px; }
.unidate { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: -6px -6px 12px; }
.unidate b { text-align: center; font-size: 17px; font-weight: 800; }
.unidate button, .trnav button { border: 0; background: transparent; font-size: 26px; line-height: 1; color: var(--accent); font-weight: 700; height: 44px; border-radius: 12px; }
.unidate button:disabled, .trnav button:disabled { color: var(--line); }
.trnav { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; background: var(--bg); border-radius: 14px; padding: 4px; }
.trinfo { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.trinfo { gap: 8px; padding: 8px 0; }
.trbig { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.trbig div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.trbig small { font-size: 12px; color: var(--muted); font-weight: 700; }
.trbig b { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.trbig b.late { color: #c0392b; }
.trinfo span { font-size: 12px; color: var(--muted); font-weight: 600; }
.trinfo small { font-size: 12px; color: var(--muted); }
.trinfo em { font-style: normal; color: #c0392b; font-weight: 700; margin-left: 6px; }
.cm-res { display: flex; flex-direction: column; gap: 14px; }
.cm-wb { display: flex; align-items: baseline; gap: 14px; }
.cm-err { margin: 0; color: var(--muted); line-height: 1.6; }
.cm-note { margin: 14px 0 0; font-size: 12px; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } .opt:active { transform: none; } }
</style>
<script src="config.js"></script>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="timetable.js"></script>
<script src="app.js"></script>
</body>
</html>
